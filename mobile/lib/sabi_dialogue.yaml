# 【FEAT-295 Phase 1f】サビ口調メッセージの一元管理 YAML。
#
# 用途: バトル / 通知 / モーダル等のサビ口調メッセージをここに集約し、
#       `sabi_tone_test.dart` の regex チェックを「YAML 全文字列」に対して走らせる
#       設計の基盤とする (将来 SabiDialogueService 経由でロードする想定)。
#
# 現状 MVP では Dart コード内に直接埋め込まれているメッセージが多数あるため、
# 本ファイルは「将来の集約先」として始め、Phase 2 以降で段階的に移行する。
#
# CLAUDE.md「サビの口調ルール」厳守:
#   - 〜ですね / 〜ますよ / 〜でしょう / 〜しましょう / 〜でしょうか
#   - 老人口調 (〜じゃ / 〜ですぞ / 〜なのじゃ) 禁止
#   - 少年口調 (〜だよ / 〜だね / 〜かな？) 禁止
#   - サビ台詞では「！」感嘆符不使用、🪶 マーカーのみ可

# ─────────────────────────────────────────────────────
# バトル関連 (FEAT-295)
# ─────────────────────────────────────────────────────
battle:
  ready:    "準備が整いましたね。出陣しましょうか 🪶"
  victory:  "勝利しました 🪶 +{coins} coins +{exp} EXP"
  defeat:   "今回は退きましょう。羽を休めて、また挑みましょうね 🪶"
  fallback_sabi: "あなたの代わりに、私が前に出ましょう 🪶"
  charges_insufficient: "チケットが足りないようですね。あと {remaining} 回の習慣で出陣できますよ 🪶"
  start_failed: "戦闘開始がうまくいきませんでした。少し時間をおいて、もう一度お試しください 🪶"
  reward_failed: "報酬の受け取りがうまくいきませんでした。少し時間をおいてもう一度お試しください 🪶"

# ─────────────────────────────────────────────────────
# 共通システム文（参考）
# ─────────────────────────────────────────────────────
system:
  network_error: "うまくいきませんでした。少し時間をおいて、もう一度お試しください 🪶"
  save_failed: "設定の保存がうまくいきませんでした。少し時間をおいて、もう一度お試しください 🪶"
