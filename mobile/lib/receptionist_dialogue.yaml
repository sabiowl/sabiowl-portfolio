# 【FEAT-305】リリア（ギルド受付 NPC）口調メッセージのドキュメント-only リファレンス YAML（PM 整理 2026-05-25）。
#
# 【重要 - 機能レビュー P3-2 解消】:
#   本 yaml は **コードから読み込まれない documentation-only ファイル** です。
#   Grep 確認: `grep -r "receptionist_dialogue.yaml" mobile/lib/` で参照ゼロ。
#   sabi_dialogue.yaml と同じパターン。
#
# 真実値: `mobile/lib/features/guild/services/receptionist_service.dart` の
#   `_kDialogue` 定数（Dart 側）が唯一の真実値。本 yaml はそれを **人間可読** で
#   ドキュメント化したもの（Backend エンジニア / 翻訳者 / PM レビュー用）。
#
# 同期義務:
#   - `_kDialogue` 変更時は本 yaml も対応更新（実装者責任）
#   - 同期が崩れても **Flutter 動作には影響ゼロ**（yaml はバンドルに含まれない）
#   - `receptionist_tone_test.dart` の regex は Dart 定数 `_kDialogue` を参照、本 yaml は対象外
#
# v1.1 FEAT-310（Backend 動的化）着手時に本 yaml を JSON or DB seed に移行 → 廃止予定。
#
# 用途: ギルド画面の `GuildReceptionView` で表示される受付セリフを一元管理する。
# `receptionist_service.dart` の Dart 定数と内容を同期させる（このファイルは
# 真の単一データソースではなく、ドキュメント + テスト regex 参照用）。
#
# 設計判断（FEAT-305 §2.4 PM 確定）: Backend API を増やさず Flutter ローカルで
# 完結（オフライン耐性 + 既存 `sabi_dialogue.yaml` パターン踏襲）。
# 真の単一ソースは `receptionist_service.dart` 内の `_kDialogue` 定数。
# 本 yaml は人間可読の参照 + 将来 Backend 動的化時 (FEAT-310+) の移行先候補。
#
# CLAUDE.md「受付女性リリア（ギルド NPC）の口調ルール」厳守:
#   - 〜ですよ! / 〜ましょう! / 〜です
#   - 一人称「私」、二人称「あなた様」/「お客様」
#   - 感嘆符使用可（明朗演出として、サビ口調との対比軸）
#   - 状況連動絵文字 🗡️ / ⚔️ / 🌸 / 🛡️ 等（🪶 はサビ専用、リリア禁止）
#   - 老人口調禁止（〜じゃ / 〜のじゃ / 〜ですぞ）
#   - 少年口調禁止（〜だよ / 〜だね / 〜かな）

guild_receptionist:
  # ── デフォルト（他条件すべて非該当時） ─────────────────────────
  # 【gameplay_review 20260525 Priority 1 #4】2 種 → 5 種に拡張。
  # 毎回同じセリフを避け、リリア初対面〜継続来訪まで多様な接客感を確保。
  default:
    - "ようこそギルドへ! 本日はどのクエストにご挑戦されますか? 🗡️"
    - "お越しいただきありがとうございます! 戦の準備はお済みですか? ⚔️"
    - "いらっしゃいませ! 本日もお客様のご活躍を楽しみにしております 🌸"
    - "ようこそお越しくださいました! どのクエストが今のあなた様に最適でしょうか 🛡️"
    - "お待ちしておりました! 掲示板から心惹かれるクエストをお選びくださいませ 🗡️"

  # ── 初回ログイン直後（作成 24h 以内） ────────────────────────
  first_login:
    - "あら、新顔のお客様ですね! 私リリアと申します。 ご来訪ありがとうございます 🌸"

  # ── Lv 上昇直後（5min 以内）{level} placeholder で動的置換 ────
  level_up:
    - "Lv.{level} おめでとうございます! 強い相手にも挑めるようになりましたね ⚔️"
    - "Lv.{level} ですか! 順調なご成長で、私も嬉しいですよ 🌸"

  # ── 休息日（player.is_rest_day_today == true） ───────────────
  rest_day:
    - "あら、本日はお休みの日でしたね。 ゆっくりと過ごされるのも一つの戦略ですよ 🌸"

  # ── 連戦中（直近 1h で Battle 5 件以上） ────────────────────
  consecutive_battles:
    - "お疲れ様です! 連戦されていますね。 ご無理なさらずに 🛡️"

  # ── 強敵解禁直後（Lv.15/25/35 到達直後 1h 以内） ────────────
  boss_unlocked:
    - "新しい相手が掲示板に追加されましたよ! ご確認くださいませ ⚔️"

  # ── 戦闘直後 勝利（5min 以内、最優先） ──────────────────────
  victory_just_now:
    # 【FEAT-315】 LiliaFloatingPanel (ホーム勝利祝福、3 秒スライド表示) でも
    # 同じプールから引くため 3 種展開。毎回同じセリフを避け多様性を確保。
    - "お見事です! 戦利品をどうぞお受け取りくださいませ 🗡️"
    - "お疲れ様でした! 見事な戦いぶりでした ⚔️"
    - "勝利の凱旋ですね! お客様の活躍に拍手を 🌸"

  # ── 戦闘直後 敗北（5min 以内、最優先） ──────────────────────
  defeat_just_now:
    - "お怪我はありませんでしたか? 次の機会に向けて、装備を見直しましょう! 🛡️"
