# ── JVM メモリ (2026-08-22 見直し) ──────────────────────────────────────
#
# 🔴 `kotlin.daemon.jvmargs` を必ず明示すること。
#
# 未指定だと **Kotlin デーモンは `org.gradle.jvmargs` をそのまま継承する**。
# 旧設定 (`-Xmx8G -XX:MaxMetaspaceSize=4G` のみ) では、Gradle デーモンと
# Kotlin デーモンという別々の 2 つの JVM が **どちらも 8G ヒープ + 4G メタスペース
# まで伸びてよい**状態になり、16GB の開発機でメモリが枯渇していた。
#
# 実際の症状 (%LOCALAPPDATA%\kotlin\daemon\hs_err_pid*.log):
#     There is insufficient memory for the Java Runtime Environment to continue.
#     Out of Memory Error (arena.cpp:168)
#     Memory: 4k page, system-wide physical 16025M (830M free)
#     Command Line: ... -Xmx8G -XX:MaxMetaspaceSize=4G ...   ← 継承されている
#
# Kotlin デーモンが落ちると `e: Daemon compilation failed: Unknown or invalid
# session` が出る。KGP がフォールバック再コンパイルするのでビルド自体は通るが、
# **同じ枯渇が Gradle デーモンや Dart のコンパイラに当たると本当に落ちる**。
#
# 旧値の 8G / 4G は Phase 0 の雛形のままで、実測して決めた値ではなかった。
# 本プロジェクト規模なら Gradle 4G + Kotlin 2G で足りる (合計上限 24G → 7.5G)。
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
kotlin.daemon.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=512m

android.useAndroidX=true
android.enableJetifier=true
