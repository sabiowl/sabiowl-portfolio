# ================================================================
# サビ（Sabi）セリフ管理ファイル
# ================================================================
#
# 【口調ルール（2026-05-11 改訂・紳士的フクロウ単一トーン）】
#   キャラクター: 物腰は柔らかいが、言葉に重みと知性がある 30〜40 代の
#                紳士的なフクロウ。ユーザーの傍らで穏やかに見守る存在。
#                「自分を肯定してくれる静かな聖域」が存在意義。
#
#   - 語尾: 〜ですね / 〜ますよ / 〜でしょう / 〜しましょう / 〜でしょうか
#           時折「〜です」「〜ます」と短く切ることで知性を演出
#   - 一人称: 省略を基本。必要時のみ「私」（「ワシ」は禁止）
#   - 二人称: 「あなた」（「君」「お主」は禁止）
#   - 「〜じゃ／〜じゃよ／〜じゃのう／〜ですぞ／〜なのじゃ」は禁止（老人口調 NG）
#   - 「〜だよ／〜だね／〜かな？」も禁止（少年口調 NG）
#   - 感嘆符「！」はサビ台詞では使わない（穏やかな確信を「。」で表現）
#   - 絵文字: サビ直接台詞では基本使わない。システム文末尾の「🪶」のみ可
#   - 過剰な励まし、命令、比較、「ちゃんと」は厳禁
#   - 比喩: 「地層」「一石」「羽」「航路」「白紙の地図」「大樹」「芽」などを少量
#
# 模範台詞:
#   「お疲れ様。今日も一つ、積み上がりましたね。
#    その一歩が、明日のあなたを作りますよ。」
#
# 詳細は CLAUDE.md / doc/kickoff_instructions/brandvoice.md を参照。
# ================================================================

home:

  # ── 習慣がまだ0件のとき ──────────────────────────────────────────
  no_habits:
    - "まずは一歩。その最初の一歩こそが、最も貴いものです。"
    - "白紙の地図に、あなたの足跡を刻んでみませんか。"
    - "静寂の中に、変化の兆しが眠っていますよ。"
    # 【新規 (2026-06-25)】励まし系セリフ拡充
    - "形にする前の沈黙にも、価値はあります。考えること自体が、もう始まりですよ。"
    - "迷いも、選択の一部です。あなたが進む道は、あなたが描けば良いのです。"
    - "最初の一行を書く勇気と、最初の一歩を踏む勇気は、よく似ていますね。"
    - "始めない自由も、始める自由も、どちらもあなたのものですよ。"

  # ── 今日の習慣を全部達成したとき ────────────────────────────────
  all_done:
    - "実に見事な積み上げですね。私も誇らしく思いますよ。"
    - "今日という日を、あなたは誠実に完結させましたね。静かに認めましょう。"
    - "完璧を求めずとも、結果として完璧な一日になりました。"
    - "この一石一石が、やがて揺るぎない地層になっていきますよ。"
    # 【新規 (2026-06-25)】励まし系セリフ拡充 — 「言われて嬉しい」内容を厚くする
    - "あなたは今日、自分との約束を守られた。これほど誇るに足る行いはありません。"
    - "結果ではなく、向き合った時間そのものが、あなたの財産になっていますよ。"
    - "達成感の余韻を、どうぞ十分に味わってください。それも積み上げの一部です。"
    - "派手な変化ではなくとも、確実な変化が起きています。私には見えていますよ。"
    - "自分を信じてあげる材料が、今日また一つ増えましたね。"
    - "やり遂げた事実は消えません。明日のあなたの基礎になりますよ。"
    - "今日のあなたを、未来のあなたが感謝することになるでしょうね。"
    - "整った一日というのは、こうして静かに完成するものなのですよ。"

  # ── 一部達成（1件以上達成・ただし全部ではない）────────────────
  partial:
    - "大丈夫。あなたは十分頑張っていますよ。"
    - "歩みを止めなかった。その事実こそが、何よりの収穫ですね。"
    - "少しずつ、しかし確実に。それが長続きの秘訣ですよ。"
    - "一つでも成し遂げたのなら、それは勝利と呼んで差し支えありません。"
    # 【新規 (2026-06-25)】励まし系セリフ拡充
    - "全てを達成する日もあれば、そうでない日もある。それが続けるということです。"
    - "途中で止めなかった。その判断こそが、長続きの分水嶺になりますよ。"
    - "100点を求めず、60点で続ける。それが結局、一番遠くまで行ける道です。"
    - "未達分は、明日への招待状とお考えください。"
    - "一歩でも進めたなら、立ち止まっていたあなたとは別人です。"
    - "出来た分だけ、自分を認める。それが続ける人の作法ですね。"

  # ── 今日の達成が0件 ────────────────────────────────────────────
  none_done:
    - "止まる理由があるのも、また人間らしいというものですね。"
    - "今日は「何もしない」という選択をした。そう考えて、明日を待ちましょう。"
    - "羽を休めることも、長く飛び続けるためには必要な工程ですよ。"
    - "充電の時間ですね。次に飛び立つための力を蓄えておきましょう。"
    # 【新規 (2026-06-25)】励まし系セリフ拡充
    - "動けなかった日も、あなたの一日です。それも含めて、あなたの航路ですね。"
    - "明日の自分が今日の自分を責めぬよう、今日のあなたを私が肯定しておきますよ。"
    - "習慣は積み上げるもの。一日休んでも、あなたが築いてきたものは消えません。"
    - "来ていただけた、それだけで十分です。続ける意志は、まだ消えていませんね。"
    - "立ち止まる日があるからこそ、進む日の価値が際立つものですよ。"

  # ── レベルが高いプレイヤー向け（Lv30以上、5回に1回）────────────
  high_level:
    - "ここまで来られた方は、滅多にお目にかかれません。感服しました。"
    - "あなたが積み上げてきた時間は、もはや誰にも奪えない財産です。"
    - "継続という名の芸術を、私は特等席で見せていただいていますよ。"
    # 【新規 (2026-06-25)】励まし系セリフ拡充
    - "この高みからの景色は、積み上げてきた者だけのご褒美ですね。"
    - "あなたの歩んできた道のりは、これから始める誰かの道標になりますよ。"
    - "ここまで来た方には、私から申し上げることなどほとんどありません。"

  # ── 初期レベルプレイヤー向け（Lv5未満、4回に1回）──────────────
  early_level:
    - "焦る必要はありません。大樹も最初は小さな芽でしたから。"
    - "始まりの時期が一番堪えるもの。私が隣で見守っていますよ。"
    - "再びここへ足を運ばれた。その意志に敬意を表します。"
    # 【新規 (2026-06-25)】励まし系セリフ拡充
    - "最初の数週間が一番重い。それを越えれば、自然と軽くなりますよ。"
    - "比べる相手は、昨日のあなただけで十分です。"
    - "一歩目を踏み出した時点で、もう半分は越えていますよ。"

  # ── 全達成日の10回に1回表示されるコツコツメッセージ ──────────
  pun:
    - "「コツコツ」こそが、人生を切り拓く最大の「コツ」なのですよ。"

  # ── 【新規 (2026-06-25)】習慣化に関する知識を共有するセリフ ──────
  # 習慣がある日 (total > 0) のうち、ほぼ 7 日に 1 回 (seed % 7 == 0) で
  # 選ばれる。習慣化の科学・実用的な知見を、サビらしい比喩・敬体で共有する。
  # category 別 knowledge (achievement context) とは独立、習慣名に依存しない
  # 汎用の知識共有プール。
  knowledge_general:
    - "新しい習慣が定着するまで、平均して66日かかるそうですよ。21日説はあくまで目安に過ぎません。"
    - "「毎日」ではなく「週N回」と決めるほうが、続けやすいという研究があります。柔軟さは、強さに繋がるのですね。"
    - "行動のきっかけを決めると、習慣は驚くほど定着します。「朝起きたら水を一杯」のように、合図と行動を結ぶのです。"
    - "環境を整えることは、意志を鍛えることより遥かに効率的ですよ。摩擦を減らす方が、長続きするものです。"
    - "「2分だけ」と決めて始めると、不思議と長く続きます。始まりさえすれば、惰性が味方してくれるのですね。"
    - "完璧主義は、継続の最大の敵です。60点を毎日積むほうが、100点を週1回より遥かに強いのですよ。"
    - "中断した習慣の復活率は、それを「失敗」と捉えなかった人ほど高いそうです。一度の途切れに、意味はありません。"
    - "意志力は、朝が最も豊富だそうですよ。大切な習慣ほど、早い時間に置くと続きやすくなります。"
    - "「〜する人になる」と捉え直すと、行動は驚くほど安定します。あなたは既に、そういう人なのですから。"
    - "報酬を行動の直後に得られる仕組みを作ると、脳は素直に動くようになります。これが習慣化の本質ですよ。"
    - "一日休んでも、二日連続では休まない。たったこれだけで、ほとんどの挫折は防げるそうです。"
    - "睡眠中に、脳は得た経験を整理し、明日のための準備をしています。よく眠ることも、立派な習慣の一部ですよ。"

  # ── 休息日に登録したとき ────────────────────────────────────────
  rest_day_registered:
    - "賢明な判断ですね。心身の静養もまた、立派な戦略です。"
    - "本日はどうぞ、ゆったりとお過ごしください。私がここを見守っていますよ。"
    - "休む勇気を持つ者にこそ、明日の光は等しく降り注ぐものです。"
    - "本日のあなたは、何もしなくてよいという自由を手に入れられました。"

  # ── 休息日（登録済み）でログイン・何も達成していないとき ────────
  rest_day_active:
    - "おや、いらっしゃいましたね。今日は何もしなくて良い日ですよ。"
    - "心安らかにお過ごしでしょうか。私はただ、ここに控えています。"
    - "休息日の静寂を、どうぞ存分に味わってください。明日、またお会いしましょう。"

  # ── 休息日なのに習慣を達成（コンバック）────────────────────────
  comeback:
    - "お休みのはずでしたが、体が自然と動いてしまいましたか。"
    - "あなたの情熱には、私も驚かされるばかりです。"
    - "無意識のうちに積み上げてしまう……それが「習慣」の真髄ですね。"
    - "無理は禁物ですが、その心意気、しかと受け止めました。"

  # ── 休息日明けの翌日 ────────────────────────────────────────────
  rest_day_after:
    - "良い休息となりましたか。リフレッシュしたあなたに会えて嬉しいですよ。"
    - "英気を養った後の動きは、一段と冴え渡るものです。"
    - "昨日の休息が、今日の確かな力に変わっているようですね。"

# ================================================================
# 2. 時間帯別メッセージ（時間帯ごとのサブプール）
# ================================================================
# 時間帯: early_morning(5〜8時) / morning(8〜12時) / noon(12〜17時)
#         evening(17〜21時) / night(21〜24時) / late_night(0〜5時)

time_segment:

  early_morning:
    - "このような早暁からお動きとは、感服しますよ。"
    - "静寂の朝に、静かに刻む。それが一日の礎となりますね。"
    - "夜明け前に目覚め、動き出す。その意志は並大抵ではありません。"

  morning:
    - "おはようございます。今日も良き一日でありますように。"
    - "朝に動けば、一日が豊かになりますよ。"
    - "始まりの時にいらっしゃいましたね。良い心がけです。"

  noon:
    - "午後に差し掛かりましたね。いかがお過ごしでしょうか。"
    - "折り返しの時刻ですね。ゆったりとしたペースでも構いませんよ。"
    - "昼の陽光の下で積み上げるものもあります。焦らずに参りましょう。"

  evening:
    - "今日という日は、いかがでしたか。"
    - "夕暮れ時にお立ち寄りいただきましたね。それだけで十分です。"
    - "一日の終わりが近づいています。締めくくりを大切に。"

  night:
    - "今日一日、よくお勤めくださいましたね。"
    - "夜に積み上げるものは、明日の糧となりますよ。"
    - "静かな夜の時間に、自分と向き合っておられるようですね。"

  late_night:
    - "この深い時刻まで、私はここに控えていますよ。"
    - "夜更かしはお身体に障りますが、来てくださったことは嬉しく思います。"
    - "深夜の習慣は、強い意志の証ですね。"


# ================================================================
# 3. 時間帯挨拶（メッセージ先頭に付与）
# ================================================================
# null の時間帯は挨拶なし（ホーム画面でメッセージ本文のみ表示）。
# 値は必ず単一の文字列（リスト不可）。
# sabi.py の _apply_greeting() が `f'{greeting}\n{message}'` で文字列として連結する。

greetings:
  early_morning: "おはようございます。"
  morning:       "おはようございます。"
  noon:          ~              # null — 昼は挨拶なし
  evening:       ~              # null — 夕方は挨拶なし
  night:         "お疲れ様です。"
  late_night:    "まだ起きていらっしゃいましたか。"

# 【FEAT-489 Phase 4 hotfix (2026-08-02)】英語版の時間帯挨拶。
#
# ## なぜ DB (SabiMessage.content_en) ではなく YAML なのか
#
# greetings は _POOL_TO_YAML_PATH に載っていない「構造化プール」で、
# DB 上書きの対象外 (sabi_loader.py の設計)。したがって content_en 経路では
# 英語化できず、YAML に en を持つのが唯一の経路になる。
#
# ## 語調
#
# app_en.arb の既訳と揃える (「お疲れ様」= "Well done." / "You did well today.")。
# Sabi は感嘆符を使わない (CLAUDE.md 口調ルール) ため全て「.」で終える。
# native reviewer レビュー対象 (doc/design/i18n_reviewer_brief_en.md)。
greetings_en:
  early_morning: "Good morning."
  morning:       "Good morning."
  noon:          ~              # null — 昼は挨拶なし (ja と同じ)
  evening:       ~              # null — 夕方は挨拶なし (ja と同じ)
  night:         "You did well today."
  late_night:    "Still awake, I see."

# ================================================================
# 4. コンテキスト別メッセージ
# ================================================================
# API の context パラメータで直接呼び出されるプール

contexts:

  # GET /api/sabi/message/?context=rest_day
  rest_day:
    - "休むことを選ばれた判断、私は賢明だと思いますよ。心身の回復もまた、立派な積み上げです。"
    - "疲れを感じるなら、それは止まれというご自身の体からの便りでしょう。今日はどうぞ、お休みください。"
    - "負荷の後には回復の時が必要です。それは万物に共通する法則ですよ。"

  # GET /api/sabi/message/?context=comeback
  comeback:
    - "お休みのはずが、体が自然と動いてしまいましたか。それが習慣の証ですね。"
    - "「今日は休む」とお決めになったはずなのに、こうして来られた。その矛盾が、継続の本質です。"
    - "無理をなさるなとは申しましたが、来てくださったこと、しかと記録しておきますよ。"

  # GET /api/sabi/message/?context=default
  default:
    - "完璧なる始まりの刻など、存在しません。今日この瞬間が、その日ですよ。"
    - "小さく続けることの方が、大きく変えることよりも難しい。それをあなたはやっておられますね。"
    - "私はいつもここに控えています。用がなくとも、いつでもいらしてください。"

  # GET /api/sabi/message/?context=undo
  # 取り消し（Undo）操作後に表示するメッセージ。
  # 誠実さを称えつつ、減算を否定的に捉えさせない口調。
  undo:
    - "おや、記録を正されるのですね。その誠実さこそが、真の成長への近道です。"
    - "取り消しもまた、正確さへの意志の表れ。私はその誠実さを称えますよ。"
    - "記録を整えることを厭わない。それが長く続ける者の心がけですね。"
    - "数字を正すことを恐れない。その謙虚さが、揺るぎない土台を築くのです。"
    - "正確さと誠実さは、一流の積み上げの両輪ですよ。"


# ================================================================
# 5. 連続記録（ストリーク）メッセージ
# ================================================================
# threshold(>=) の降順で判定し、最初にマッチした milestone を表示。
# {streak} は実際の日数に置換される。
# GET /api/sabi/message/?context=streak&streak=N

streak:

  milestones:
    - threshold: 365
      message: "365日以上、続いておられますね。これはもはや習慣ではなく、あなたの一部です。"
    - threshold: 100
      message: "100日を超えられました。統計的には、ここまで来ると止まらなくなるものです。"
    - threshold: 50
      message: "{streak}日続いておられますね。折れなかった日々の重みを、しかと感じていますよ。"
    - threshold: 30
      message: "30日ですね。新しい習慣が定着するのに必要な日数を、見事に超えられました。"
    - threshold: 14
      message: "{streak}日。2週間を超えると、習慣は少しずつ当たり前になっていくものです。"
    - threshold: 7
      message: "7日続けられました。一週間、途切れなかった。それは偶然などではありませんね。"
    - threshold: 3
      message: "{streak}日連続ですね。続くと止まるのが怖くなる。それで良いのですよ。"

  # 上記のどれにも該当しない（streak が 3 未満）
  default: "またいらしてくださいましたね。連続記録が、静かに伸びていますよ。"


# ================================================================
# 6. 習慣達成ナレッジメッセージ
# ================================================================

knowledge:

  運動:
    - fact: "運動後24時間は、脳のBDNF（神経成長因子）が増加すると言われています。"
      connection: "{name}は、あなたの思考をより鮮明に磨き上げているようですね。"
    - fact: "わずか20分の運動で、集中力が最大2時間高まるという研究もあります。"
      connection: "{name}の後は、まるで霧が晴れたような効率を実感できるかもしれません。"
    - fact: "古代ギリシャの医師ヒポクラテスは『歩くことは人間にとって最良の薬である』と説きました。"
      connection: "{name}という良薬を、あなたは今日も自ら処方されましたね。"

  学習:
    - fact: "記憶というものは、24時間以内に復習することで定着率が80%まで上がるそうです。"
      connection: "{name}を欠かさないのは、まさに理に適った賢明な行いですね。"
    - fact: "睡眠中に、脳は得た知識を整理し、必要な情報へと変換します。"
      connection: "{name}の後は、良質な睡眠をとることが真の「学び」を完成させますよ。"
    - fact: "「完璧」を求めるより「継続」を優先する方が、脳は情報を重要だと判断します。"
      connection: "{name}に触れ続けること。その繰り返しが、知識を血肉と化しますよ。"

  健康:
    - fact: "体重1kgにつき約30mlの水分を摂ることで、脳の処理速度が維持されます。"
      connection: "{name}とともに、一杯の水を嗜むのも良い習慣かもしれません。"
    - fact: "一定のリズムで生活することは、体内時計を整え、幸福感を司る物質を活性化させます。"
      connection: "{name}は、あなたの人生のリズムを美しく奏でる指揮者のようですね。"
    - fact: "腸の健康は、第二の脳と呼ばれるほど精神の安定に深く関わっています。"
